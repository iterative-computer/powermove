[package]
name = "powermove-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
bytes = "1.12.1"
diffy = "0.5.2"
dirs = "7.0.0"
dunce = "1.0.5"
fontdb = "0.24.0"
futures = "0.3.34"
hex = "0.4.3"
notify = "8.2.0"
oxc_allocator = "0.154.0"
oxc_ast = "0.154.0"
oxc_ast_visit = "0.154.0"
oxc_parser = "0.154.0"
oxc_span = "0.154.0"
parking_lot = "0.12.5"
rand = "0.10.3"
raw-window-handle = "0.6"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "stream"] }
rfd = "0.17.2"
rquickjs = "0.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.53.2", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.28.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_UI_WindowsAndMessaging"] }
