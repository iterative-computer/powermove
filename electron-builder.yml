appId: com.zellzoi.powermove
productName: Powermove

directories:
  output: dist

asar: true
files:
  - out/**
extraResources:
  - from: node_modules/@openai/codex-darwin-arm64/vendor/aarch64-apple-darwin/bin/codex
    to: codex/bin/codex
  - from: src/extensions
    to: builtin-extensions
  - from: docs/EXTENSIONS.md
    to: api-pack/EXTENSIONS.md
  - from: docs/background-testing.md
    to: api-pack/BACKGROUND_TESTING.md
  - from: src/renderer/src/kernel/api.ts
    to: api-pack/api.ts
  - from: src/shared/extensions.ts
    to: api-pack/extensions.ts
  - from: src/renderer/src/core/types/project.ts
    to: api-pack/project.ts
  - from: src/renderer/src/core/types/commands.ts
    to: api-pack/commands.ts
extraMetadata:
  main: out/main/index.js

afterPack: ./scripts/after-pack.mjs
artifactName: ${productName}-${version}-mac-${arch}.${ext}

mac:
  identity: null
  hardenedRuntime: false
  icon: resources/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
