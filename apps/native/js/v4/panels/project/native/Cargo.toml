# Linux/macOS worker adapter and verification tools.
# Explicit member of apps/native; uses its shared locked dependency graph.
[package]
name = "pm-project-panel-check"
version = "0.1.0"
edition = "2024"
publish = false
[lib]
path = "lib.rs"
[[test]]
name = "project_bridge"
path = "tests.rs"
[[bin]]
name = "project-model-host"
path = "test_host.rs"
[[bin]]
name = "project-inspect-wire"
path = "inspect_wire.rs"
[dependencies]
accesskit = "=0.24.1"
pm-panel-media = { path = "../../../../../crates/panel-media" }
pm-kernel = { path = "../../../../../crates/kernel" }
pm-model = { path = "../../../../../../../engine/crates/pm-model" }
pm-surface = { path = "../../../../../crates/surface" }
pm-design = { path = "../../../../../crates/design" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
