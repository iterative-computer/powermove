[workspace]
resolver = "3"
members = ["spikes/*", "crates/*", "crates/acceptance/runtime", "packaging", "js/v4/panels/effects/conformance", "js/v4/panels/export/wire", "js/v4/panels/effect-controls/native", "js/v4/panels/project/native"]
exclude = ["vendor/gpui-ce"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

# Release code with review links (`cfg(debug_assertions)`): the soak
# (scripts/stability/soak.py) drives a release-optimised app through them.
[profile.soak]
inherits = "release"
debug-assertions = true

# The engine's work counters (texture, buffer, pipeline and bind-group
# creations, passes, draws, uploads, readbacks) reach a traced viewer's rows
# through the same wgpu front crate the engine workspace builds with:
# engine/third_party/wgpu/POWERMOVE.md.
[patch.crates-io]
wgpu = { path = "../../engine/third_party/wgpu" }
