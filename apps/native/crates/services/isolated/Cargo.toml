# Linux-only validation of the same sources; no macOS workspace resolution.
[package]
name = "pm-services"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[lib]
path = "../src/lib.rs"

[workspace]
resolver = "3"

[dependencies]
anyhow = "1"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2.5"
semver = "1"

[dev-dependencies]
tempfile = "3"
