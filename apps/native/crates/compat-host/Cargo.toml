[package]
name = "pm-compat-host"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
macos-probes = []

[dependencies]
pm-remote-dom = { path = "../remote-dom" }
pm-store-host = { path = "../store-host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
objc2-web-kit = "0.3.2"
objc2-quartz-core = "0.3.2"
objc2-core-graphics = "0.3.2"
block2 = "0.6.2"

[[example]]
name = "offscreen-probe"
required-features = ["macos-probes"]

[[example]]
name = "remote-dom-smoke"
required-features = ["macos-probes"]
