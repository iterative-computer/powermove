[package]
name = "pm-scene3d"
description = "Host-independent Studio document schema, edits, navigation and import admission"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
sha2 = "0.10"
pm-model = { path = "../../../../engine/crates/pm-model" }
pm-geom3d = { path = "../../../../engine/crates/pm-geom3d" }
pm-import-fbx = { path = "../../../../engine/crates/pm-import-fbx" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[features]
# Explicit opt-in; absent native tools fail these tests instead of skipping.
native-cad-tests = []
