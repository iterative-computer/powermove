[package]
name = "pm-engine-service"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["kernel"]
kernel = ["dep:pm-kernel", "dep:pm-scene3d"]
studio-oidn = ["pm-studio/oidn"]
native-cad-tests = ["kernel", "pm-scene3d/native-cad-tests"]

[dependencies]
pm-memory = { path = "../../../../engine/crates/pm-memory" }
pm-studio = { path = "../../../../engine/crates/pm-studio" }
anyhow = "1"
async-channel = "2"
pm-scene3d = { path = "../scene3d", optional = true }
pm-kernel = { path = "../kernel", optional = true }
pm-eval = { path = "../../../../engine/crates/pm-eval" }
pm-audio = { path = "../../../../engine/crates/pm-audio" }
pm-gpu = { path = "../../../../engine/crates/pm-gpu" }
pm-render = { path = "../../../../engine/crates/pm-render" }
pm-color = { path = "../../../../engine/crates/pm-color" }
pm-text = { path = "../../../../engine/crates/pm-text", default-features = false, features = ["system"] }
pm-media = { path = "../../../../engine/crates/pm-media" }
pm-model = { path = "../../../../engine/crates/pm-model" }
pm-export = { path = "../../../../engine/crates/pm-export" }
pm-time = { path = "../../../../engine/crates/pm-time" }
pm-promedia = { path = "../promedia" }
blake3 = "1"
pm-protocol = { path = "../../../../engine/crates/pm-protocol" }
wgpu = { version = "30", default-features = false, features = ["metal", "wgsl"] }
wgpu-hal = { version = "30", features = ["metal"] }
metal = "0.33"
foreign-types = "0.5"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSScreen", "NSGraphics", "NSView", "NSResponder", "NSWindow", "objc2-quartz-core"] }
objc2-foundation = "0.3"
objc2-quartz-core = "0.3"
objc2-core-graphics = "0.3"
core-graphics-types = "0.2"
block = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
half = "2"
# Process/thread QoS classes for the viewer audio thread (crate::qos).
libc = "0.2"
mimalloc = { version = "0.1", default-features = false }
# Per-frame work counters in the opt-in viewer trace.
pm-perf = { path = "../../../../engine/crates/pm-perf" }

[dev-dependencies]
# The audio-status test holds and fails decoders (pm-audio's test hooks).
pm-audio = { path = "../../../../engine/crates/pm-audio", features = ["test-hooks"] }
# Parallel test fixtures wait for a compiler slot (pm-glsl `test-admission`).
pm-glsl = { path = "../../../../engine/crates/pm-glsl", features = ["test-admission"] }
tempfile = "3"
# Sequence export tests write 16-bit frames.
png = "0.18"

[[test]]
name = "fonts"
harness = false
