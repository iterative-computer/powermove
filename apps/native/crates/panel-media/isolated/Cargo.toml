# Linux validation of production sources without macOS workspace resolution.
[package]
name = "pm-panel-media"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[workspace]
resolver = "3"

[lib]
path = "../src/lib.rs"

[[test]]
name = "behaviour"
path = "../tests/behaviour.rs"

[dependencies]
pm-kernel = { path = "../../kernel" }
pm-model = { path = "../../../../../engine/crates/pm-model" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
