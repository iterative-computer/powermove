[package]
name = "pm-panel-studio3d"
description = "Worker-side 3D Studio panels over the real kernel and scene services"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
pm-kernel = { path = "../kernel" }
pm-scene3d = { path = "../scene3d" }
pm-design = { path = "../design" }
pm-model = { path = "../../../../engine/crates/pm-model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
pm-surface = { path = "../surface" }
