[package]
name = "pm-update-policy"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
macos-sparkle = []

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1"

[dependencies]
anyhow = "1"
fs2 = "0.4"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2.5"
