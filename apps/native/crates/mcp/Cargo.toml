[package]
name = "pm-mcp"
description = "Headless automation and the frozen Powermove MCP contract"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
pm-scene3d = { path = "../scene3d" }
pm-kernel = { path = "../kernel" }
pm-model = { path = "../../../../engine/crates/pm-model" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
libc = "0.2"
icu_collator = "2"
async-channel = "2"
sha2 = "0.10"

[[bin]]
name = "powermove-mcp"
path = "src/main.rs"
