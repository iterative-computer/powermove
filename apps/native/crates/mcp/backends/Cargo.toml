# Host bindings have an owned lockfile: the root workspace lock belongs to the
# integration lane. App hosts can depend on this crate without changing pm-mcp.
[package]
name = "pm-mcp-backends"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[workspace]
resolver = "3"

[dependencies]
pm-mcp = { path = ".." }
pm-services = { path = "../../services" }
pm-promedia = { path = "../../promedia" }
url = "2.5"

serde_json = "1"
