[package]
name = "pm-native-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
[[bin]]
name = "powermove-native"
path = "src/main.rs"
[features]
# Product telemetry (PostHog); the release/dist build turns it on.
telemetry = ["pm-telemetry/telemetry"]
# The owner's Aero trial (Sandbox builds only; shipping builds never set it): turns on the
# development switch (Settings › Providers and the Powermove harness) in a release build.
aero-trial = ["pm-agents/require-core"]
# The Sandbox and other ad-hoc signed builds (PM_V2_FEATURES=profile-session): the Powermove
# account session lives in the profile (cloud/secrets, 0600) instead of the login Keychain, so a
# rebuild never asks for the Keychain password. Shipped Developer ID builds never set it.
profile-session = []
# The Sandbox against a local cloud stack (PM_V2_FEATURES=dev-cloud-origin): PM_CLOUD_ORIGIN
# may point the account, billing and Aero at http://127.0.0.1:<port>. Never in a shipped release.
dev-cloud-origin = [
    "pm-agents/dev-cloud-origin",
    "pm-compat-runner/dev-cloud-origin",
    "pm-services/dev-cloud-origin",
]

[dependencies]
pm-fx-defs = { path = "../../../../engine/crates/pm-fx-defs" }
pm-mcp = { path = "../mcp" }
pm-export = { path = "../../../../engine/crates/pm-export" }
url = "2.5"
pm-shell = { path = "../shell" }
pm-telemetry = { path = "../telemetry" }
anyhow = "1"
pm-kernel = { path = "../kernel" }
pm-engine-service = { path = "../engine-service" }
pm-design = { path = "../design" }
pm-model = { path = "../../../../engine/crates/pm-model" }
pm-expr = { path = "../../../../engine/crates/pm-expr" }
pm-gpu = { path = "../../../../engine/crates/pm-gpu" }
pm-time = { path = "../../../../engine/crates/pm-time" }
pm-color = { path = "../../../../engine/crates/pm-color" }
pm-protocol = { path = "../../../../engine/crates/pm-protocol" }
pm-render = { path = "../../../../engine/crates/pm-render" }
pm-eval = { path = "../../../../engine/crates/pm-eval" }
pm-text = { path = "../../../../engine/crates/pm-text", default-features = false, features = ["system"] }
gpui = { package = "gpui-ce", path = "../../vendor/gpui-ce/crates/gpui", default-features = false, features = ["frame-capture", "headless-support"] }
metal = "0.33"
foreign-types = "0.5"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
objc2-quartz-core = "0.3"
objc2-core-graphics = "0.3"
block2 = "0.6"
async-channel = "2"
libc = "0.2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
blake3 = "1"
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
sha2 = "0.10"
base64 = "0.22"

pm-builtins = { path = "../builtins" }
pm-agents = { path = "../agents" }
pm-media = { path = "../../../../engine/crates/pm-media" }
pm-audio = { path = "../../../../engine/crates/pm-audio" }
png = "0.18"
pm-compat-runner = { path = "../compat-runner", features = ["macos-sandbox"] }
pm-compat-host = { path = "../compat-host" }
pm-recorder = { path = "../recorder" }
pm-surface = { path = "../surface" }
pm-runtime-v8 = { path = "../runtime-v8", features = ["macos-sandbox"] }
raw-window-handle = "0.6"
pm-promedia = { path = "../promedia" }
pm-proxy = { path = "../../../../engine/crates/pm-proxy" }
gpui_macos = { package = "gpui_ce_macos", path = "../../vendor/gpui-ce/crates/gpui_macos", features = ["frame-capture"] }

pm-panel-media = { path = "../panel-media" }
pm-panel-studio3d = { path = "../panel-studio3d" }
pm-scene3d = { path = "../scene3d" }
pm-first-launch = { path = "../first-launch" }
pm-native-migrate = { path = "../migrate" }
pm-services = { path = "../services" }
pm-captions = { path = "../../../../engine/crates/pm-captions" }
pm-transcribe = { path = "../transcribe" }
pm-update-policy = { path = "../update-policy" }
pm-panel-agentpanel = { path = "../panel-agentpanel" }
objc2-user-notifications = "0.3"
pm-panel-viewerchrome = { path = "../panel-viewerchrome" }
pm-panel-timeline = { path = "../panel-timeline" }

[[test]]
name = "text_commands"
harness = false
[[test]]
name = "close_guard_gpui"
harness = false
# AppKit text views live on the main thread: this binary keeps it (PM-749).
[[test]]
name = "composer_undo"
harness = false

[[example]]
name = "pm-corpus"
path = "../../../../tools/corpus/main.rs"

[dev-dependencies.gpui]
package = "gpui-ce"
path = "../../vendor/gpui-ce/crates/gpui"
default-features = false
features = ["test-support"]
# The disk reserve override exists only in test builds (pm-proxy test-hooks).
[dev-dependencies.pm-proxy]
path = "../../../../engine/crates/pm-proxy"
features = ["test-hooks"]
[dev-dependencies.pm-native-migrate]
path = "../migrate"
[dev-dependencies.ed25519-dalek]
version = "2.2"

[dev-dependencies.sha1]
version = "0.10"

[dev-dependencies.tar]
version = "0.4"

[dev-dependencies.flate2]
version = "1"

[dev-dependencies.pm-store-host]
path = "../store-host"

[dev-dependencies.fs2]
version = "0.4"
[dev-dependencies.pm-media]
path = "../../../../engine/crates/pm-media"
[dev-dependencies.pm-render]
path = "../../../../engine/crates/pm-render"
# Parallel test fixtures wait for a compiler slot (pm-glsl `test-admission`).
[dev-dependencies.pm-glsl]
path = "../../../../engine/crates/pm-glsl"
features = ["test-admission"]
# Tests stop a project with an injected kernel panic (never in the app).
[dev-dependencies.pm-kernel]
path = "../kernel"
features = ["fault-injection"]
[target.'cfg(target_os = "macos")'.dependencies]
gpui_apple = { package = "gpui_ce_apple", path = "../../vendor/gpui-ce/crates/gpui_apple", features = ["headless-support"] }
gpui_parley = { package = "gpui_ce_parley", path = "../../vendor/gpui-ce/crates/gpui_ce_parley" }

# The exact pure composer-focus test also runs from the app workspace.
[[test]]
name = "composer_keyboard"
path = "../../vendor/gpui-ce/crates/gpui_macos/src/native_text_keyboard.rs"

[dev-dependencies.pm-panel-inspector]
path = "../panel-inspector"
