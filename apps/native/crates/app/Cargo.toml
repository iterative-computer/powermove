[package]
name = "pm-native-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
[[bin]]
name = "powermove-native"
path = "src/main.rs"
[dependencies]
pm-mcp = { path = "../mcp" }
url = "2.5"
pm-shell = { path = "../shell" }
anyhow = "1"
pm-kernel = { path = "../kernel" }
pm-engine-service = { path = "../engine-service" }
pm-design = { path = "../design" }
pm-model = { path = "../../../../engine/crates/pm-model" }
pm-gpu = { path = "../../../../engine/crates/pm-gpu" }
pm-time = { path = "../../../../engine/crates/pm-time" }
pm-color = { path = "../../../../engine/crates/pm-color" }
pm-protocol = { path = "../../../../engine/crates/pm-protocol" }
pm-render = { path = "../../../../engine/crates/pm-render" }
pm-eval = { path = "../../../../engine/crates/pm-eval" }
pm-text = { path = "../../../../engine/crates/pm-text", default-features = false, features = ["system"] }
gpui = { package = "gpui-ce", path = "../../vendor/gpui-ce/crates/gpui", default-features = false, features = ["frame-capture"] }
metal = "0.33"
foreign-types = "0.5"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
objc2-quartz-core = "0.3"
objc2-core-graphics = "0.3"
block2 = "0.6"
async-channel = "2"
libc = "0.2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
blake3 = "1"
tempfile = "3"
sha2 = "0.10"
base64 = "0.22"

pm-builtins = { path = "../builtins" }
pm-agents = { path = "../agents" }
pm-media = { path = "../../../../engine/crates/pm-media" }
png = "0.18"
pm-compat-runner = { path = "../compat-runner", features = ["macos-sandbox"] }
pm-compat-host = { path = "../compat-host" }
pm-recorder = { path = "../recorder" }
pm-surface = { path = "../surface" }
pm-runtime-v8 = { path = "../runtime-v8", features = ["macos-sandbox"] }
raw-window-handle = "0.6"
pm-promedia = { path = "../promedia" }
pm-proxy = { path = "../../../../engine/crates/pm-proxy" }
gpui_macos = { package = "gpui_ce_macos", path = "../../vendor/gpui-ce/crates/gpui_macos", features = ["frame-capture"] }

pm-panel-media = { path = "../panel-media" }
pm-first-launch = { path = "../first-launch" }
pm-services = { path = "../services" }
pm-update-policy = { path = "../update-policy" }
pm-panel-agentpanel = { path = "../panel-agentpanel" }
objc2-user-notifications = "0.3"
pm-panel-viewerchrome = { path = "../panel-viewerchrome" }
pm-panel-timeline = { path = "../panel-timeline" }

[[test]]
name = "text_commands"
harness = false

[[example]]
name = "pm-corpus"
path = "../../../../tools/corpus/main.rs"

[dev-dependencies.gpui]
package = "gpui-ce"
path = "../../vendor/gpui-ce/crates/gpui"
default-features = false
features = ["test-support"]
# The disk reserve override exists only in test builds (pm-proxy test-hooks).
[dev-dependencies.pm-proxy]
path = "../../../../engine/crates/pm-proxy"
features = ["test-hooks"]
[dev-dependencies.pm-native-migrate]
path = "../migrate"
[dev-dependencies.ed25519-dalek]
version = "2.2"

[dev-dependencies.tar]
version = "0.4"

[dev-dependencies.flate2]
version = "1"

[dev-dependencies.pm-store-host]
path = "../store-host"

[dev-dependencies.fs2]
version = "0.4"
[dev-dependencies.pm-export]
path = "../../../../engine/crates/pm-export"
[dev-dependencies.pm-audio]
path = "../../../../engine/crates/pm-audio"
[dev-dependencies.pm-media]
path = "../../../../engine/crates/pm-media"
[dev-dependencies.pm-render]
path = "../../../../engine/crates/pm-render"
[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui_apple = { package = "gpui_ce_apple", path = "../../vendor/gpui-ce/crates/gpui_apple", features = ["test-support"] }
gpui_parley = { package = "gpui_ce_parley", path = "../../vendor/gpui-ce/crates/gpui_ce_parley" }
