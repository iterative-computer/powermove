[package]
name = "pm-acceptance-runtime"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

# An optional native backing executable keeps V8 out of the kernel-only harness
# and does not require a change to the shared native-workspace lockfile.
[workspace]
resolver = "3"

[features]
macos-sandbox = ["pm-runtime-v8/macos-sandbox", "pm-compat-runner/macos-sandbox"]

[dependencies]
pm-acceptance = { path = ".." }
pm-compat-runner = { path = "../../compat-runner" }
pm-mcp = { path = "../../mcp" }
pm-runtime-v8 = { path = "../../runtime-v8" }
pm-services = { path = "../../services" }
pm-promedia = { path = "../../promedia" }
pm-remote-dom = { path = "../../remote-dom" }
pm-surface = { path = "../../surface" }
pm-store-host = { path = "../../store-host" }
pm-recorder-raster = { path = "../../recorder-raster" }
serde_json = "=1.0.150"

[profile.dev]
debug = 0
incremental = false
