[package]
name = "pm-acceptance-runtime"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

# An optional native backing executable keeps V8 out of the kernel-only harness
# and does not require a change to the shared native-workspace lockfile.
[workspace]
resolver = "3"

[features]
macos-sandbox = ["pm-runtime-v8/macos-sandbox"]

[dependencies]
pm-runtime-v8 = { path = "../../runtime-v8" }
serde_json = "=1.0.150"

[profile.dev]
debug = 0
incremental = false
