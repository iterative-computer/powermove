[package]
name = "pm-acceptance-e2e"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

# Independent, like acceptance/runtime: do not change the acceptance lane's
# lib.rs, runner, manifest, lockfile or inventory cardinalities.
[workspace]
resolver = "3"

[lib]
path = "mod.rs"

[[bin]]
name = "pm-e2e-triage"
path = "main.rs"

[dependencies]
pm-acceptance = { path = "../.." }
pm-kernel = { path = "../../../kernel" }
pm-mcp = { path = "../../../mcp" }
pm-model = { path = "../../../../../../engine/crates/pm-model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
debug = 0
incremental = false
