[package]
name = "pm-first-launch"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1"
aes = "0.8"
base64 = "0.22"
blake3 = "1"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
fs2 = "0.4"
libc = "0.2"
pbkdf2 = "0.12"
pm-distribution = { path = "../../packaging" }
sha2 = "0.10"
pm-kernel = { path = "../kernel" }
pm-model = { path = "../../../../engine/crates/pm-model" }
pm-native-migrate = { path = "../migrate" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
zeroize = "1"

[dev-dependencies]
crc32c = "0.6"
tempfile = "3"
