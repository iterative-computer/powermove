[package]
name = "pm-compat-runner"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[features]
macos-sandbox = ["pm-runtime-v8/macos-sandbox"]

[dependencies]
pm-runtime-v8 = { path = "../runtime-v8" }
pm-recorder = { path = "../recorder" }
pm-kernel = { path = "../kernel" }
pm-mcp = { path = "../mcp" }
pm-model = { path = "../../../../engine/crates/pm-model" }
serde_json = "=1.0.150"

[[bin]]
name = "pm-compat-runner"
path = "src/main.rs"
