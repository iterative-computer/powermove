[package]
name = "pm-compat-runner"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[features]
macos-sandbox = ["pm-runtime-v8/macos-sandbox"]

[dependencies]
semver = "1"
pm-runtime-v8 = { path = "../runtime-v8" }
pm-recorder = { path = "../recorder" }
pm-kernel = { path = "../kernel" }
pm-mcp = { path = "../mcp" }
pm-scene3d = { path = "../scene3d" }
pm-model = { path = "../../../../engine/crates/pm-model" }
pm-store-host = { path = "../store-host" }
pm-compat-host = { path = "../compat-host" }
pm-remote-dom = { path = "../remote-dom" }
serde_json = "=1.0.150"
png = "0.18"
base64 = "0.22"
sha2 = "=0.10.9"
url = "2"
ed25519-dalek = "2.2"
resvg = { version = "=0.48.1", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"] }

[dev-dependencies]
pm-protocol = { path = "../../../../engine/crates/pm-protocol" }
tempfile = "3"
libc = "=0.2.186"
tar = "0.4"
flate2 = "1"
regex = "1"

[[bin]]
name = "pm-compat-runner"
path = "src/main.rs"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-core-foundation = { version = "0.3.2", features = ["CFBase", "CFCGTypes", "CFData", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3.2", features = ["CGBitmapContext", "CGColorSpace", "CGContext", "CGImage"] }
objc2-image-io = { version = "0.3.2", features = ["CGImageDestination", "CGImageSource", "objc2-core-graphics"] }
objc2-core-text = { version = "0.3.2", default-features = false, features = ["std", "CTFontManager"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-app-kit = "0.3.2"
objc2-web-kit = "0.3.2"

[[test]]
name = "webkit_join"
harness = false
