[package]
name = "pm-compat-runner"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[features]
macos-sandbox = ["pm-runtime-v8/macos-sandbox"]

[dependencies]
pm-runtime-v8 = { path = "../runtime-v8" }
pm-recorder = { path = "../recorder" }
pm-kernel = { path = "../kernel" }
pm-mcp = { path = "../mcp" }
pm-model = { path = "../../../../engine/crates/pm-model" }
pm-store-host = { path = "../store-host" }
pm-compat-host = { path = "../compat-host" }
pm-remote-dom = { path = "../remote-dom" }
serde_json = "=1.0.150"
png = "0.18"
base64 = "0.22"
sha2 = "=0.10.9"
url = "2"

[dev-dependencies]
pm-protocol = { path = "../../../../engine/crates/pm-protocol", default-features = false }
tempfile = "3"
libc = "=0.2.186"
ed25519-dalek = "2.2"
tar = "0.4"
flate2 = "1"

[[bin]]
name = "pm-compat-runner"
path = "src/main.rs"

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
objc2-web-kit = "0.3.2"

[[test]]
name = "webkit_join"
harness = false
