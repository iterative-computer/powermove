[package]
name = "pm-telemetry"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Product telemetry (PostHog). Without the `telemetry` feature this crate is
# the event types, the sharing preference and the main-thread sampler only:
# every capture call is an empty inline function and no network code is
# compiled. The release/dist build turns the feature on.
[features]
default = []
telemetry = ["dep:posthog", "dep:rustls", "dep:backtrace", "dep:findshlibs", "dep:uuid", "dep:chrono"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
posthog = { version = "1.4", default-features = false, features = ["tls-no-provider"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
backtrace = { version = "0.3.74", optional = true }
findshlibs = { version = "0.10", optional = true }
uuid = { version = "1", features = ["v4", "v5", "v7"], optional = true }
chrono = { version = "0.4", default-features = false, features = ["std"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", features = ["NSProcessInfo", "NSLocale", "NSString"] }

[dev-dependencies]
tempfile = "3"
flate2 = "1"
