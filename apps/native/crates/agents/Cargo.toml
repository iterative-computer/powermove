[package]
name = "pm-agents"
description = "Rust agent protocol workers, durable threads and pinned native runtimes"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# Passes pm-aero-core's require-core through (pm-native-app's aero-trial).
require-core = ["pm-aero-core/require-core"]
# A build that may run on a local development stack (PM_CLOUD_ORIGIN): debug
# builds always; the Sandbox through pm-native-app's dev-cloud-origin. Never shipped.
dev-cloud-origin = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
base64 = "0.22"
flate2 = "1"
libc = "0.2"
url = "2"
toml_edit = "0.25"
pm-aero-core = { path = "../aero-core" }
reqwest = { version = "0.12", default-features = false, features = ["blocking"] }
