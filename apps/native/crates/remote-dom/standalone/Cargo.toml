# Linux verification without resolving the macOS workspace or changing its lock.
[package]
name = "pm-remote-dom"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[lib]
path = "../src/lib.rs"

[[test]]
name = "routing"
path = "../tests/routing.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]
