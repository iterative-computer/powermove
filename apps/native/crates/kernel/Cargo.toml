[package]
name = "pm-kernel"
description = "Powermove Native kernel: the single-writer actor (document, transactions, history, journal, library store)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Pure Rust, no GPUI. Grown from pm-mac-core (the document authority), which
# is now a thin re-export of this crate (docs/native/kernel.md). Engine crates
# are linked by path (docs/gpui/engine-boundary.md, section 2).

[dependencies]
pm-scene3d = { path = "../scene3d" }
serde_json = "1"
pm-model = { path = "../../../../engine/crates/pm-model" }
pm-wasm = { path = "../../../../engine/crates/pm-wasm" }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
# Edit kernels (groups, reparenting, anchors) and the evaluator's temporal
# math, both already linked through pm-wasm.
pm-edit = { path = "../../../../engine/crates/pm-edit" }
pm-eval = { path = "../../../../engine/crates/pm-eval" }
# Expression validation (`expressionDiagnostic`).
pm-expr = { path = "../../../../engine/crates/pm-expr" }
# Text types for the measure stub the group-placement kernel takes.
pm-text = { path = "../../../../engine/crates/pm-text", default-features = false }
libc = "0.2"
# v1.3.0+ stores gzip envelopes for large values (main/storage-codec.ts).
flate2 = "1"

[dev-dependencies]
serde_json = "1"

[features]
# Opt-in real OCCT import/save tests, with required explicit native helper paths.
native-scene3d-cad-tests = ["pm-scene3d/native-cad-tests"]
