[package]
name = "pm-kernel"
description = "Powermove Native kernel: the single-writer actor (document, transactions, history, journal, library store)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Pure Rust, no GPUI. Engine crates are linked by path
# (docs/gpui/engine-boundary.md, section 2).

[dependencies]
pm-captions = { path = "../../../../engine/crates/pm-captions" }
pm-fx-defs = { path = "../../../../engine/crates/pm-fx-defs" }
pm-scene3d = { path = "../scene3d" }
serde_json = "1"
pm-model = { path = "../../../../engine/crates/pm-model" }
# The project's colour types (its Output).
pm-protocol = { path = "../../../../engine/crates/pm-protocol" }
pm-wasm = { path = "../../../../engine/crates/pm-wasm" }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
# Edit kernels (groups, reparenting, anchors) and the evaluator's temporal
# math, both already linked through pm-wasm.
pm-edit = { path = "../../../../engine/crates/pm-edit" }
pm-eval = { path = "../../../../engine/crates/pm-eval" }
# Expression validation (`expressionDiagnostic`).
pm-expr = { path = "../../../../engine/crates/pm-expr" }
# Text types for the measure stub the group-placement kernel takes.
pm-text = { path = "../../../../engine/crates/pm-text", default-features = false }
libc = "0.2"
# v1.3.0+ stores gzip envelopes for large values (main/storage-codec.ts).
flate2 = "1"
zstd = "0.14"
base64 = "0.22"

[dev-dependencies]
serde_json = "1"

[features]
# Panic injection on the transaction path (crate::fault_injection), for tests
# of the hosts that must survive a contained kernel panic.
fault-injection = []
# Synthetic large projects for the scale benches (crate::synthetic).
synthetic = []
# The save writer before step texts, kept for the byte-equality checks of the
# current writer against it (tests, examples/save_timing.rs --compare).
save-reference = []
# Opt-in real OCCT import/save tests, with required explicit native helper paths.
native-scene3d-cad-tests = ["pm-scene3d/native-cad-tests"]

[[bench]]
name = "edit_scale"
harness = false
required-features = ["synthetic"]

[[example]]
name = "save_timing"
required-features = ["save-reference"]

[[example]]
name = "scale_project"
required-features = ["synthetic"]
