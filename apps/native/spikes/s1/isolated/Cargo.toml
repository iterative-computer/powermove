[package]
name = "pm-native-s1-spike"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
v8 = { version = "=152.2.0", features = ["v8_enable_sandbox"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
libc = "=0.2.186"

# Same sources, isolated lock: other native lanes share the parent workspace.
[workspace]
resolver = "3"

[[bin]]
name = "pm-native-s1-spike"
path = "../src/main.rs"

[profile.dev]
debug = 0
incremental = false

[profile.release]
debug = 0
