[package]
name = "pm-distribution"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
ed25519-dalek = "2.2"
fs2 = "0.4"
pm-services = { path = "../crates/services" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2.5"

[dev-dependencies]
tempfile = "3"
