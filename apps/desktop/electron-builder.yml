appId: com.zellzoi.powermove
productName: Powermove

directories:
  output: dist

asar: true
electronLanguages:
  - en
files:
  - out/**
  - "!**/* [2-9].*"
  - "!**/* [2-9]"
  - '!node_modules/ffmpeg-static/ffmpeg'
  # The native agent runtimes are copied once below, at the paths used by the
  # packaged binary resolvers. Keep their npm wrappers/metadata, but do not let
  # electron-builder auto-pack a second copy of either platform executable.
  - '!node_modules/@openai/codex-darwin-arm64/**'
  - '!node_modules/@anthropic-ai/claude-code-darwin-arm64/**'
  - '!node_modules/@anthropic-ai/claude-code/bin/claude.exe'
  # esbuild/lib/main.js resolves the @esbuild platform package at runtime. The
  # install-time bin copy is the same executable and is not used by Powermove.
  - '!node_modules/esbuild/bin/esbuild'
extraResources:
  - from: resources/sounds
    to: sounds
  - from: node_modules/ffmpeg-static/ffmpeg
    to: encoder/ffmpeg
  - from: node_modules/ffmpeg-static/LICENSE
    to: encoder/LICENSE
  - from: node_modules/@openai/codex-darwin-arm64/vendor/aarch64-apple-darwin
    to: codex
    filter:
      - "**/*"
      - "!**/* [2-9]"
      - "!**/* [2-9].*"
  - from: node_modules/@anthropic-ai/claude-code-darwin-arm64/claude
    to: claude/bin/claude
  - from: src/extensions
    to: builtin-extensions
    filter:
      - "**/*"
  - from: docs/EXTENSIONS.md
    to: api-pack/EXTENSIONS.md
  - from: docs/background-testing.md
    to: api-pack/BACKGROUND_TESTING.md
  - from: src/renderer/src/kernel/api.ts
    to: api-pack/api.ts
  - from: src/shared/extensions.ts
    to: api-pack/extensions.ts
  - from: src/renderer/src/core/types/project.ts
    to: api-pack/project.ts
  - from: src/renderer/src/core/types/commands.ts
    to: api-pack/commands.ts
  - from: docs/samples/media-browser
    to: api-pack/samples/media-browser
    filter:
      - "**/*"
  - from: docs/samples/gradient-tint
    to: api-pack/samples/gradient-tint
    filter:
      - "**/*"
  - from: src/main/agent-tools/mcp-server.mjs
    to: agent-tools/mcp-server.mjs
extraMetadata:
  main: out/main/index.js

afterPack: ./scripts/after-pack.mjs
# Releases live in this repository. electron-updater reads the GitHub release
# feed (latest-mac.yml / beta-mac.yml), so the repo must be public for updates
# to work on user machines. Drafts first: parallel asset uploads race release
# creation, and the workflow publishes the draft once every asset is up.
publish:
  provider: github
  owner: iterative-computer
  repo: powermove
  releaseType: draft

artifactName: ${productName}-${version}-mac-${arch}.${ext}

mac:
  # Local dist:mac builds stay unsigned. scripts/release-mac.mjs flips
  # identity, hardenedRuntime and notarize on for CI releases.
  identity: null
  hardenedRuntime: false
  category: public.app-category.graphics-design
  entitlementsInherit: resources/entitlements.mac.plist
  icon: resources/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
