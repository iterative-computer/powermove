services:
  postgres:
    image: postgres:17-alpine
    container_name: powermove-cloud-postgres
    environment:
      POSTGRES_DB: powermove
      POSTGRES_USER: powermove
      POSTGRES_PASSWORD: powermove
    ports:
      - "54329:5432"
    volumes:
      - powermove-cloud-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U powermove -d powermove"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  powermove-cloud-pg:
