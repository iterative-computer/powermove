name: Release macOS Beta
on:
  push:
    tags: ['v*-beta.*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-beta
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate beta tag and Apple Silicon runner
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$(uname -m)" = arm64
          node -e 'if (!/^v\d+\.\d+\.\d+-beta\.\d+$/.test(process.env.RELEASE_TAG)) throw Error("Select a vX.Y.Z-beta.N tag")'
      - run: npm ci
      - name: Set release version
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
      - name: Test update and session lifecycle
        run: npx vitest run src/main/updates.test.ts src/main/menu.test.ts src/main/storage.test.ts
      - name: Write notarization key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          test -n "$APPLE_API_KEY_P8"
          umask 077
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/notary.p8"
      - name: Build, sign, notarize, and verify
        run: npm run dist:release
        env:
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/notary.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
      - name: Verify update manifest
        run: |
          test -s dist/beta-mac.yml
          test -s "dist/Powermove-${GITHUB_REF_NAME#v}-mac-arm64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: powermove-${{ github.ref_name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/beta-mac.yml
          if-no-files-found: error
      - name: Publish complete beta
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo motionerapp/powermove-releases \
            --draft --prerelease --title "Powermove ${GITHUB_REF_NAME#v}" \
            --notes 'Apple Silicon macOS beta. Drag Powermove to Applications before opening. Updates download automatically and install when you quit.' \
            dist/*.dmg dist/*.zip dist/*.blockmap dist/beta-mac.yml
          gh release edit "$GITHUB_REF_NAME" --repo motionerapp/powermove-releases --draft=false
      - name: Remove notarization key
        if: always()
        run: rm -f "$RUNNER_TEMP/notary.p8"
