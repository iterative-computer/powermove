name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Typecheck and unit tests
    runs-on: macos-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/Library/Caches/electron
            node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-node-22-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Typecheck
        run: npm run typecheck
      - name: Vitest
        run: npx vitest run
      - name: Legacy oracle
        # Remove this step in the final Phase 6 legacy-retirement commit.
        run: npm test

  e2e:
    name: Electron end-to-end tests
    runs-on: macos-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/Library/Caches/electron
            node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-node-22-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Build
        run: npm run build
      - name: Playwright
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 7
