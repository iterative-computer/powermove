name: V1 to V2 update rehearsal
# A real Powermove 1.3.2 on a clean runner, pointed at a local copy of a V2
# release dry run's feed: electron-updater downloads V2, Squirrel swaps it in
# on quit, and the V2 that lands launches (migrating the V1 profile). Nothing
# is published and no secret is used.
on:
  workflow_dispatch:
    inputs:
      dry_run_id:
        description: Run id of a green Release Powermove V2 dry run, or "live" for the published Latest release
        required: true
        type: string
      version:
        description: Its version
        required: true
        default: 2.0.0
        type: string
permissions:
  contents: read
  actions: read
jobs:
  rehearse:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: V2 from the dry run
        if: inputs.dry_run_id != 'live'
        run: |
          set -euo pipefail
          gh run download "${{ inputs.dry_run_id }}" -R "$GITHUB_REPOSITORY" -n "signed-app-$VERSION" -D signed
          feed="$GITHUB_WORKSPACE/dry/feeds"
          mkdir -p "$feed"
          # A dry run also keeps its feeds; a real release run keeps only the signed app, so the
          # feed is written here in electron-updater's shape.
          if ! gh run download "${{ inputs.dry_run_id }}" -R "$GITHUB_REPOSITORY" -n "dry-run-$VERSION" -D dry; then
            printf 'version: %s\nfiles:\n  - url: Powermove-%s-mac-arm64.zip\n    sha512: x\n    size: 0\npath: Powermove-%s-mac-arm64.zip\nsha512: x\nreleaseDate: %s\nminimumSystemVersion: 23.0.0\n' \
              "$VERSION" "$VERSION" "$VERSION" "'$(date -u +%Y-%m-%dT%H:%M:%S.000Z)'" > "$feed/latest-mac.yml"
          fi
          find dry signed -maxdepth 3 -type f 2>/dev/null | sed 's/^/  /' || true
          # A dry run keeps the signed app (a ditto archive, as the update ZIP is) but not the ZIP itself:
          # serve it as the ZIP, with the feed's checksum and size made to match.
          zip="$feed/Powermove-$VERSION-mac-arm64.zip"
          cp signed/signed-app.zip "$zip"
          sha=$(openssl dgst -sha512 -binary "$zip" | base64)
          size=$(stat -f%z "$zip")
          python3 - "$feed/latest-mac.yml" "$sha" "$size" <<'PY'
          import re, sys
          path, sha, size = sys.argv[1:]
          text = open(path).read()
          text = re.sub(r'(sha512: ).*', lambda m: m.group(1) + sha, text)
          text = re.sub(r'(size: ).*', lambda m: m.group(1) + size, text)
          open(path, 'w').write(text)
          PY
          echo "FEED=$feed" >> "$GITHUB_ENV"
          cat "$feed/latest-mac.yml"
      - name: Powermove 1.3.2, pointed at the local feed
        run: |
          set -euo pipefail
          gh release download v1.3.2 -R "$GITHUB_REPOSITORY" -p 'Powermove-1.3.2-mac-arm64.zip' -D v1
          ditto -x -k v1/Powermove-1.3.2-mac-arm64.zip /Applications
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' /Applications/Powermove.app/Contents/Info.plist
          echo '--- shipped app-update.yml'; cat /Applications/Powermove.app/Contents/Resources/app-update.yml
          # "live": V1 keeps its shipped GitHub feed, exactly as a user's copy does.
          if [ "${{ inputs.dry_run_id }}" != live ]; then
            printf 'provider: generic\nurl: http://127.0.0.1:8765/\nupdaterCacheDirName: powermove-updater\n' \
              > /Applications/Powermove.app/Contents/Resources/app-update.yml
          fi
      - name: Serve the feed
        if: inputs.dry_run_id != 'live'
        run: |
          set -euo pipefail
          (cd "$FEED" && nohup python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/feed.log" 2>&1 &)
          sleep 2
          curl -sf http://127.0.0.1:8765/latest-mac.yml > /dev/null
      - name: Run V1 until V2 is downloaded and staged, then quit it
        run: |
          set -uo pipefail
          /Applications/Powermove.app/Contents/MacOS/Powermove > "$RUNNER_TEMP/v1.log" 2>&1 &
          pid=$!
          staged=""
          for i in $(seq 1 120); do
            if grep -qiE "update-downloaded|has been downloaded" "$RUNNER_TEMP/v1.log"; then staged=yes; break; fi
            sleep 5
          done
          echo '--- feed requests'; cat "$RUNNER_TEMP/feed.log" 2>/dev/null || true
          echo '--- V1 log (updates)'; grep -iE "update|squirrel|download|error" "$RUNNER_TEMP/v1.log" | tail -40
          test -n "$staged" || { echo "V1 never finished downloading V2"; exit 1; }
          sleep 10
          osascript -e 'tell application id "com.zellzoi.powermove" to quit' || true
          for i in $(seq 1 30); do kill -0 "$pid" 2>/dev/null || break; sleep 2; done
          kill -0 "$pid" 2>/dev/null && { echo "V1 did not quit"; exit 1; } || echo "V1 quit"
      - name: The app in place is V2, intact
        run: |
          set -euo pipefail
          # Squirrel's ShipIt moves V1 out and V2 in after V1 quits: wait through the moment between.
          v=""
          for i in $(seq 1 100); do
            v=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' /Applications/Powermove.app/Contents/Info.plist 2>/dev/null || true)
            [ "$v" = "$VERSION" ] && break
            sleep 3
          done
          ls -la /Applications | grep -i powermove || true
          ls ~/Library/Caches/com.zellzoi.powermove.ShipIt 2>/dev/null && tail -40 ~/Library/Caches/com.zellzoi.powermove.ShipIt/ShipIt_stderr.log 2>/dev/null || true
          echo "version in place: $v"
          test "$v" = "$VERSION"
          # Squirrel names the installed bundle after CFBundleExecutable: V2 must land at the same path.
          test ! -e /Applications/powermove-native.app || { echo "V2 was installed under another name"; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' /Applications/Powermove.app/Contents/Info.plist
          codesign --verify --deep --strict --verbose=2 /Applications/Powermove.app
          ls ~/Library/Caches/com.zellzoi.powermove.ShipIt 2>/dev/null | head || true
      - name: V2 launches from the swapped app and finds the V1 profile
        run: |
          set -uo pipefail
          exe=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' /Applications/Powermove.app/Contents/Info.plist)
          "/Applications/Powermove.app/Contents/MacOS/$exe" > "$RUNNER_TEMP/v2.log" 2>&1 &
          pid=$!
          sleep 45
          if kill -0 "$pid" 2>/dev/null; then echo "V2 is running after 45 s"; alive=yes; else alive=""; fi
          # Running is not enough: "Powermove can't start" also stays up. The V1 library must be migrated.
          native="$HOME/Library/Application Support/com.zellzoi.powermove.native-beta"
          echo '--- native profile'; ls -la "$native" || true
          test -f "$native/migration.json" || { echo "V2 did not migrate the V1 profile"; alive=""; }
          echo '--- V2 log'; tail -60 "$RUNNER_TEMP/v2.log"
          echo '--- profiles'; ls ~/Library/Application\ Support/ | grep -i powermove || true
          kill "$pid" 2>/dev/null || true
          test -n "$alive"
