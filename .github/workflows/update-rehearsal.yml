name: V1 to V2 update rehearsal
# A real Powermove 1.3.2 on a clean runner, pointed at a local copy of a V2
# release dry run's feed: electron-updater downloads V2, Squirrel swaps it in
# on quit, and the V2 that lands launches (migrating the V1 profile). Nothing
# is published and no secret is used.
on:
  workflow_dispatch:
    inputs:
      dry_run_id:
        description: Run id of a green Release Powermove V2 dry run
        required: true
        type: string
      version:
        description: Its version
        required: true
        default: 2.0.0
        type: string
permissions:
  contents: read
  actions: read
jobs:
  rehearse:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: V2 from the dry run
        run: |
          set -euo pipefail
          gh run download "${{ inputs.dry_run_id }}" -R "$GITHUB_REPOSITORY" -n "dry-run-$VERSION" -D dry
          find dry -maxdepth 3 -type f | sed 's/^/  /'
          feed=$(dirname "$(find dry -name latest-mac.yml | head -1)")
          test -f "$feed/Powermove-$VERSION-mac-arm64.zip" || cp "$(find dry -name "Powermove-$VERSION-mac-arm64.zip" | head -1)" "$feed/"
          echo "FEED=$GITHUB_WORKSPACE/$feed" >> "$GITHUB_ENV"
          cat "$feed/latest-mac.yml"
      - name: Powermove 1.3.2, pointed at the local feed
        run: |
          set -euo pipefail
          gh release download v1.3.2 -R "$GITHUB_REPOSITORY" -p 'Powermove-1.3.2-mac-arm64.zip' -D v1
          ditto -x -k v1/Powermove-1.3.2-mac-arm64.zip /Applications
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' /Applications/Powermove.app/Contents/Info.plist
          echo '--- shipped app-update.yml'; cat /Applications/Powermove.app/Contents/Resources/app-update.yml
          printf 'provider: generic\nurl: http://127.0.0.1:8765/\nupdaterCacheDirName: powermove-updater\n' \
            > /Applications/Powermove.app/Contents/Resources/app-update.yml
      - name: Serve the feed
        run: |
          set -euo pipefail
          (cd "$FEED" && nohup python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/feed.log" 2>&1 &)
          sleep 2
          curl -sf http://127.0.0.1:8765/latest-mac.yml > /dev/null
      - name: Run V1 until V2 is downloaded and staged, then quit it
        run: |
          set -uo pipefail
          /Applications/Powermove.app/Contents/MacOS/Powermove > "$RUNNER_TEMP/v1.log" 2>&1 &
          pid=$!
          staged=""
          for i in $(seq 1 72); do
            if grep -qiE "update-downloaded|has been downloaded" "$RUNNER_TEMP/v1.log"; then staged=yes; break; fi
            sleep 5
          done
          echo '--- feed requests'; cat "$RUNNER_TEMP/feed.log"
          echo '--- V1 log (updates)'; grep -iE "update|squirrel|download|error" "$RUNNER_TEMP/v1.log" | tail -40
          test -n "$staged" || { echo "V1 never finished downloading V2"; exit 1; }
          sleep 10
          osascript -e 'tell application id "com.zellzoi.powermove" to quit' || true
          for i in $(seq 1 30); do kill -0 "$pid" 2>/dev/null || break; sleep 2; done
          kill -0 "$pid" 2>/dev/null && { echo "V1 did not quit"; exit 1; } || echo "V1 quit"
      - name: The app in place is V2, intact
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            v=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' /Applications/Powermove.app/Contents/Info.plist)
            [ "$v" = "$VERSION" ] && break
            sleep 3
          done
          echo "version in place: $v"
          test "$v" = "$VERSION"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' /Applications/Powermove.app/Contents/Info.plist
          codesign --verify --deep --strict --verbose=2 /Applications/Powermove.app
          ls ~/Library/Caches/com.zellzoi.powermove.ShipIt 2>/dev/null | head || true
      - name: V2 launches from the swapped app and finds the V1 profile
        run: |
          set -uo pipefail
          exe=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' /Applications/Powermove.app/Contents/Info.plist)
          "/Applications/Powermove.app/Contents/MacOS/$exe" > "$RUNNER_TEMP/v2.log" 2>&1 &
          pid=$!
          sleep 45
          if kill -0 "$pid" 2>/dev/null; then echo "V2 is running after 45 s"; alive=yes; else alive=""; fi
          echo '--- V2 log'; tail -60 "$RUNNER_TEMP/v2.log"
          echo '--- profiles'; ls ~/Library/Application\ Support/ | grep -i powermove || true
          kill "$pid" 2>/dev/null || true
          test -n "$alive"
