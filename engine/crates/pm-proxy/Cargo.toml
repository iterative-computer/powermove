[package]
name = "pm-proxy"
description = "Representation policy and generated media (section 14)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
pm-protocol = { path = "../pm-protocol", default-features = false }
pm-media = { path = "../pm-media" }
pm-color = { path = "../pm-color" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
blake3 = "1.8"
tempfile = "3"
libc = "0.2"
png = "0.18"

[features]
# Test hooks (the disk guard's reserve override, `TEST_DISK_RESERVE_ENV`);
# off in the app. Tests and e2e addon builds (`build-engine-addon.mjs
# --test-hooks`) turn it on.
test-hooks = []
