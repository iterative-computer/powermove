[package]
name = "pm-glsl"
description = "The section 11 GLSL ES 3.00 pipeline for effects, transitions, and fragment layers: limits, ES validation, glslang, SPIR-V rewrites, naga"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
glslang = "0.8.1"
glslang-sys = "0.8.1"
rspirv = "0.13.0"
naga = { version = "30.0.1", features = ["spv-in", "msl-out", "serialize", "deserialize"] }
serde.workspace = true
serde_json.workspace = true
sha2 = { workspace = true, features = ["std"] }

[[bin]]
name = "pm-glsl-fuzz"
path = "src/bin/fuzz.rs"

[[bin]]
name = "pm-glsl-compiler"
path = "src/bin/compiler.rs"

[features]
# The production Metal inventory also pulls the macOS renderer/media stack.
macos-inventory = []
# Test builds only: the process-wide pool waits for a free slot within the
# request deadline (parallel fixtures), never in shipped builds.
test-admission = []

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[example]]
name = "inventory"
required-features = ["macos-inventory"]

[target.'cfg(target_os = "macos")'.dev-dependencies]
pm-render = { path = "../pm-render" }
pm-gpu = { path = "../pm-gpu", default-features = false, features = ["glsl"] }

[dev-dependencies]
pm-color = { path = "../pm-color" }
naga = { version = "30.0.1", features = ["wgsl-in"] }
wgpu = { version = "30", default-features = false, features = ["metal", "naga-ir"] }
pollster = "0.4"
