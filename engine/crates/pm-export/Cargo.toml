[package]
name = "pm-export"
description = "Encoders, muxers, render queue (section 17)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Test-only sinks (in-memory and raw-file encoder-input sinks) for other crates' tests.
test-sinks = []

[dependencies]
pm-gpu = { path = "../pm-gpu" }
pm-time = { path = "../pm-time" }
pm-protocol = { path = "../pm-protocol", default-features = false }
pm-model = { path = "../pm-model" }
pm-eval = { path = "../pm-eval" }
# The job engine's export pipeline: render through pm-render, mix through
# pm-audio's offline API (section 17).
pm-render = { path = "../pm-render" }
pm-blender = { path = "../pm-blender" }
pm-audio = { path = "../pm-audio" }
# FFmpeg (libvpx, libopus, the WebM muxer) through pm-media's bindings to
# Powermove's LGPL build.
pm-media = { path = "../pm-media" }
png = "0.18"
wgpu = { version = "30", default-features = false, features = ["metal", "wgsl"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
thiserror.workspace = true
libm.workspace = true
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# exception: AVFoundation reports misuse by raising Objective-C exceptions; they become errors.
objc2 = { version = "0.6.5", features = ["exception"] }
block2 = "0.6.2"
objc2-foundation = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-video = { version = "0.3.2", features = ["objc2-io-surface"] }
# Enables the IOSurfaceRef CF type objc2-core-video needs.
objc2-io-surface = "0.3.2"
objc2-core-media = "0.3.2"
objc2-core-audio-types = "0.3.2"
objc2-avf-audio = { version = "0.3.2", default-features = false, features = ["std", "AVAudioSettings"] }
objc2-video-toolbox = { version = "0.3.2", features = ["objc2-core-media", "objc2-core-video", "objc2-foundation"] }
objc2-av-foundation = { version = "0.3.2", features = ["objc2-core-media", "objc2-core-video", "objc2-core-foundation"] }

[dev-dependencies]
sha2.workspace = true
serde_json.workspace = true
pm-export = { path = ".", features = ["test-sinks"] }
