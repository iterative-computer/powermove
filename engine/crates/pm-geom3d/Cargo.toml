[package]
name = "pm-geom3d"
description = "3D geometry: generators, glTF, BVH, depth sets (sections 7 and 8)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
libm.workspace = true
serde_json.workspace = true
# The container and document schema; extensions come from the raw JSON.
gltf = { version = "1.4.1", default-features = false, features = ["utils", "names", "extensions", "extras"] }

[dev-dependencies]
pm-model = { path = "../pm-model" }
sha2 = { workspace = true, features = ["std"] }
serde_json.workspace = true
