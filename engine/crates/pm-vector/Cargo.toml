[package]
name = "pm-vector"
description = "Shape, path, and mask geometry (sections 10 and 31): ports of today's Canvas2D geometry onto kurbo"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Deterministic geometry digest over generated cases, used to check that
# native and wasm32 builds produce bit-identical output (see tests/wasm/).
conformance = []
# The rendering side (docs/engine/vector.md): the Canvas2D-compatible
# rasterizer of compat level 1, the scene model, the vello_cpu coverage
# backend, and SVG through usvg (text off) with filters through resvg.
# Off for pm-eval and pm-wasm, which need geometry only.
render = ["dep:pm-text", "dep:i_overlay", "usvg/text", "usvg/system-fonts", "dep:peniko", "dep:vello_cpu", "dep:usvg", "dep:resvg", "dep:tiny-skia"]
# Vello's GPU compute coverage backend on the engine's wgpu device.
gpu = ["render", "dep:vello", "dep:wgpu"]

[dependencies]
pm-text = { path = "../pm-text", default-features = false, features = ["render"], optional = true }
kurbo = "0.13.1"
libm.workspace = true
ryu-js.workspace = true
peniko = { version = "0.6.1", optional = true }
i_overlay = { version = "9.1", optional = true }
vello_cpu = { version = "0.3", default-features = false, features = ["std", "u8_pipeline", "f32_pipeline"], optional = true }
usvg = { version = "0.48.1", default-features = false, optional = true }
resvg = { version = "0.48.1", default-features = false, features = ["raster-images"], optional = true }
tiny-skia = { version = "0.12", optional = true }
vello = { version = "0.11", default-features = false, features = ["wgpu"], optional = true }
wgpu = { version = "30", default-features = false, features = ["metal", "wgsl"], optional = true }

[dev-dependencies]
pm-text = { path = "../pm-text", default-features = false, features = ["render", "system"] }
pm-skia-path = { path = "../pm-skia-path" }
png = "0.18"
# Exact float parsing for the bit-for-bit vector comparisons.
serde_json = { workspace = true, features = ["float_roundtrip"] }

[[example]]
name = "digest"
required-features = ["conformance"]

[[example]]
name = "digest_wasm"
crate-type = ["cdylib"]
required-features = ["conformance"]

[[example]]
name = "canvas_compare"
required-features = ["render"]

[[test]]
name = "canvas2d"
required-features = ["render"]
