<svg xmlns="http://www.w3.org/2000/svg" width="120" height="100" viewBox="0 0 120 100">
<filter id="adjust" filterUnits="userSpaceOnUse" x="0" y="0" width="120" height="100">
<feColorMatrix in="SourceGraphic" type="saturate" values="0.3" result="s"/>
<feColorMatrix in="s" type="hueRotate" values="90" result="h"/>
<feComponentTransfer in="h" result="t"><feFuncR type="table" tableValues="0 1 0.5"/><feFuncG type="discrete" tableValues="0.2 0.8"/><feFuncB type="gamma" amplitude="1.2" exponent="0.7" offset="0.05"/></feComponentTransfer>
<feColorMatrix in="SourceGraphic" type="luminanceToAlpha" result="l"/>
<feBlend in="t" in2="l" mode="multiply" result="m"/>
<feBlend in="m" in2="SourceGraphic" mode="screen" result="sc"/>
<feComposite in="sc" in2="SourceGraphic" operator="atop" result="at"/>
<feComposite in="at" in2="l" operator="xor" result="x"/>
<feComposite in="x" in2="SourceGraphic" operator="arithmetic" k1="0.5" k2="0.25" k3="0.5" k4="0"/>
</filter>
<g filter="url(#adjust)">
<rect x="14" y="12" width="64" height="52" rx="6" fill="#4C8DFF"/>
<circle cx="74" cy="56" r="30" fill="#E83A5E" fill-opacity="0.7"/>
</g>
</svg>
