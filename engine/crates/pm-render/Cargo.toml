[package]
name = "pm-render"
description = "Render graph, 2D layers, 3D scene pass, effects (section 8)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
pm-protocol = { path = "../pm-protocol", default-features = false }
pm-model = { path = "../pm-model" }
pm-time = { path = "../pm-time" }
pm-eval = { path = "../pm-eval" }
pm-expr = { path = "../pm-expr" }
pm-color = { path = "../pm-color" }
pm-geom3d = { path = "../pm-geom3d" }
pm-gpu = { path = "../pm-gpu", features = ["glsl"] }
pm-media = { path = "../pm-media" }
# Glyph rendering (text and captions, docs/engine/text-render.md).
pm-text = { path = "../pm-text", default-features = false, features = ["render"] }
vello = { version = "0.11", default-features = false, features = ["wgpu"] }
kurbo = "0.13.1"
wgpu = { version = "30", default-features = false, features = ["metal", "wgsl"] }
thiserror.workspace = true
libm.workspace = true
regex = "1"
sha2 = { workspace = true, features = ["std"] }
serde_json.workspace = true

[dev-dependencies]
pm-export = { path = "../pm-export", features = ["test-sinks"] }
pm-text = { path = "../pm-text", features = ["system", "render"] }
flate2 = "1.1"
png = "0.18"

[[test]]
# Runs on the main thread: the CoreText font registry uses AppKit's font
# manager.
name = "text_raster"
harness = false

[[test]]
# Runs on the main thread (the CoreText font registry).
name = "text_corpus"
harness = false

[[test]]
# Runs on the main thread (the CoreText font registry).
name = "text_gpu"
harness = false
