[package]
name = "pm-render"
description = "Render graph, 2D layers, 3D scene pass, effects (section 8)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
pm-protocol = { path = "../pm-protocol", default-features = false }
# Work counters (docs/engine/perfbench.md).
pm-perf = { path = "../pm-perf" }
pm-model = { path = "../pm-model" }
pm-time = { path = "../pm-time" }
pm-eval = { path = "../pm-eval" }
pm-expr = { path = "../pm-expr" }
pm-color = { path = "../pm-color" }
pm-geom3d = { path = "../pm-geom3d" }
png = "0.18"
pm-gpu = { path = "../pm-gpu", features = ["glsl"] }
pm-glsl = { path = "../pm-glsl" }
pollster = "0.4"
serde.workspace = true
pm-media = { path = "../pm-media" }
pm-vector = { path = "../pm-vector", features = ["gpu"] }
# Glyph rendering (text and captions, docs/engine/text-render.md).
pm-text = { path = "../pm-text", default-features = false, features = ["render", "level2"] }
vello = { version = "0.11", default-features = false, features = ["wgpu"] }
kurbo = "0.13.1"
wgpu = { version = "30", default-features = false, features = ["metal", "wgsl"] }
thiserror.workspace = true
libm.workspace = true
regex = "1"
sha2 = { workspace = true, features = ["std"] }
blake3 = "1.8"
serde_json.workspace = true

# Level 1 glyph masks from CoreGraphics, as Canvas2D draws them
# (docs/engine/text-render.md, "Glyph masks").
[target.'cfg(target_os = "macos")'.dependencies]
pm-text = { path = "../pm-text", default-features = false, features = ["render", "level2", "cg-masks"] }

[dev-dependencies]
tempfile = "3"
pm-export = { path = "../pm-export", features = ["test-sinks"] }
# f64 reference renders for the quality gates (docs/engine/gate-policy.md).
pm-reference = { path = "../pm-reference" }
# Anchor edits on level 2 text (the semantic gate runs the edit kernels).
pm-edit = { path = "../pm-edit" }
pm-text = { path = "../pm-text", features = ["system", "render", "coretext-reference"] }
read-fonts = "0.45"
png = "0.18"

[[test]]
# Runs on the main thread: the CoreText font registry uses AppKit's font
# manager.
name = "text_raster"
harness = false

[[test]]
# Runs on the main thread (the CoreText font registry).
name = "text_corpus"
harness = false

[[test]]
# Runs on the main thread (the CoreText font registry).
name = "svg_corpus"
harness = false

[[test]]
# Runs on the main thread (the CoreText font registry).
name = "space25d_picks"
harness = false

[[test]]
# Runs on the main thread (the CoreText font registry).
name = "text_gpu"
harness = false

[[test]]
# Runs on the main thread (the CoreText font registry and reference).
name = "text_level2"
harness = false

[[test]]
name = "text_level2_semantics"
harness = false

[[test]]
# Runs on the main thread (the CoreText font registry).
name = "text_colors"
harness = false
