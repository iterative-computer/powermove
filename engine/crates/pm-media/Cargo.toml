[package]
name = "pm-media"
description = "Probe, demux, decode, index (section 13)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
links = "pm_media_native"

[dependencies]
pm-time = { path = "../pm-time" }
pm-protocol = { path = "../pm-protocol", default-features = false }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = { workspace = true, features = ["std"] }
blake3 = "1.8"
md-5 = "0.10"
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "bmp", "ico", "gif", "webp"] }

[dev-dependencies]
proptest.workspace = true

[build-dependencies]
bindgen = "0.72"
sha2 = { workspace = true, features = ["std"] }
