[package]
name = "pm-bridge"
description = "napi-rs addon in main: the frame bridge (section 18: Mach rendezvous, audit-token and Team ID checks, surface hand-off) and, before Phase 2, the font registry (section 12)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The engine processes link this rlib for the client side of the
# rendezvous. The addon Electron main loads is the cdylib-only
# pm-bridge-addon crate over it (built with `--features node`), so the
# release profile's LTO applies to it (docs/engine/release-build.md). The
# napi glue is behind the `node` feature so the crate builds and tests
# without Node's symbols (they resolve when Node loads the addon); the napi
# exports are tested from JavaScript (scripts/fonts-smoke.mjs, the frame
# bridge's Electron integration test).

[[bin]]
# Plays the engine in the cross-process rendezvous tests.
name = "pm-bridge-peer"
path = "src/bin/pm-bridge-peer.rs"
test = false

[dependencies]
libc = "0.2"
thiserror.workspace = true
napi = { version = "3.14", default-features = false, features = ["napi9"], optional = true }
napi-derive = { version = "3.6", optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = "0.3.2"
objc2-io-surface = "0.3.2"
objc2-foundation = { version = "0.3.2", optional = true }
objc2-app-kit = { version = "0.3.2", optional = true }
objc2 = { version = "0.6", optional = true }
pm-text = { path = "../pm-text", default-features = false, features = ["system"], optional = true }

[features]
node = ["dep:napi", "dep:napi-derive", "dep:serde", "dep:serde_json", "dep:pm-text"]
# Measurement helpers for the S1 harness (synthetic input, EDR headroom).
# Never in release builds.
harness = ["node", "dep:objc2", "dep:objc2-foundation", "dep:objc2-app-kit"]
