[package]
name = "pm-protocol"
description = "Engine protocol messages and contract types (section 19)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["ts"]
# TypeScript generation through ts-rs. Off for consumers that only need the
# wire types (pm-wasm can build with default-features = false).
ts = ["dep:ts-rs"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
libm.workspace = true
rmp-serde = "1.3"
serde_bytes = "0.11"
ts-rs = { version = "12", optional = true, features = ["serde-json-impl", "no-serde-warnings"] }

[dev-dependencies]
proptest = "1.12"
