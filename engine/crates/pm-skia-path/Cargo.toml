[package]
name = "pm-skia-path"
version = "0.12.0"
edition = "2021"
license = "BSD-3-Clause"
publish = false
description = "tiny-skia-path 0.12.0 with conics kept, as Skia's SkPath keeps them (glyph frames for pm-text)"

[lib]
name = "pm_skia_path"
path = "src/lib.rs"

[features]
default = ["std"]
no-std-float = ["libm"]
std = []

[dependencies]
arrayref = "0.3.9"
bytemuck = "1.24"
libm = { version = "0.2.16", optional = true }
strict-num = { version = "0.1", default-features = false }
