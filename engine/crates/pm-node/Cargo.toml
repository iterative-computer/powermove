[package]
name = "pm-node"
description = "napi-rs host for engine processes (section 19)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The napi glue is behind the `node` feature so the workspace builds and
# tests without Node's symbols (they resolve when Node loads the addon). The
# addon itself is the cdylib-only pm-node-addon crate over this rlib, so the
# release profile's LTO applies to it (docs/engine/release-build.md).

[dependencies]
pm-engine = { path = "../pm-engine" }
pm-protocol = { path = "../pm-protocol", default-features = false }
serde.workspace = true
serde_json.workspace = true
# The font service (plan section 12, Phase 2): the CoreText registry (macOS)
# and subsets, on the utility process's main thread.
pm-text = { path = "../pm-text", default-features = false, features = ["system"] }
libc = "0.2"
napi = { version = "3.14", default-features = false, features = ["napi9"], optional = true }
napi-derive = { version = "3.6", optional = true }

# The frame bridge's engine side (plan section 18): the presenter, its pools,
# and the check-in with main.
[target.'cfg(target_os = "macos")'.dependencies]
pm-bridge = { path = "../pm-bridge" }
pm-gpu = { path = "../pm-gpu", default-features = false }
wgpu = { version = "30", default-features = false, features = ["metal", "wgsl"] }
# The viewer draws the document (Phase 2 tracer bullet) and the job
# engine renders and exports (sections 17 and 20): pm-render frames,
# pm-audio playback (the viewer's master clock) and offline mix, the
# session's pm-model mirror, VideoToolbox and AVAssetWriter through
# pm-export. This links FFmpeg (pm-media) into the addon.
pm-blender = { path = "../pm-blender" }
pm-export = { path = "../pm-export" }
pm-render = { path = "../pm-render" }
# Direct, for its FFmpeg location (DEP_PM_MEDIA_NATIVE_FFMPEG_LIB in build.rs).
pm-media = { path = "../pm-media" }
pm-audio = { path = "../pm-audio" }
pm-eval = { path = "../pm-eval" }
pm-model = { path = "../pm-model" }

[features]
node = ["dep:napi", "dep:napi-derive"]
# The C′ prototype (pm-gpu `remote-layer`): measurement builds only. Without
# it, POWERMOVE_BRIDGE_REMOTE_LAYER=1 reports that this build has no C′.
remote-layer = ["pm-gpu/remote-layer"]
# Test hooks on production types (a held paused frame,
# POWERMOVE_BRIDGE_TEST_SEND_DELAY_MS); off in the app. The crate's own
# tests turn it on through the dev-dependency below.
test-hooks = []

[dev-dependencies]
pm-model = { path = "../pm-model" }
# The audio status test holds and fails decoders (pm-audio's test hooks).
pm-audio = { path = "../pm-audio", features = ["test-hooks"] }
pm-node = { path = ".", features = ["test-hooks"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[[test]]
# Runs on the main thread (the CoreText registry uses AppKit's font manager).
name = "fonts"
harness = false

[[test]]
# The engine's render fonts: the child's host runs on its main thread.
name = "render_fonts"
harness = false
