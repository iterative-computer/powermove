[package]
name = "pm-node"
description = "napi-rs host for engine processes (section 19)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The addon is a cdylib loaded by the engine utility processes. The napi
# glue is behind the `node` feature so the workspace builds and tests
# without Node's symbols (they resolve when Node loads the addon).
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pm-engine = { path = "../pm-engine" }
pm-protocol = { path = "../pm-protocol", default-features = false }
serde.workspace = true
serde_json.workspace = true
# The font service (plan section 12, Phase 2): the CoreText registry (macOS)
# and subsets, on the utility process's main thread.
pm-text = { path = "../pm-text", default-features = false, features = ["system"] }
libc = "0.2"
napi = { version = "3.14", default-features = false, features = ["napi9"], optional = true }
napi-derive = { version = "3.6", optional = true }

# The frame bridge's engine side (plan section 18): the presenter, its pools,
# and the check-in with main.
[target.'cfg(target_os = "macos")'.dependencies]
pm-bridge = { path = "../pm-bridge" }
# Without decode-in until media reaches the engine (no FFmpeg in the addon yet).
pm-gpu = { path = "../pm-gpu", default-features = false }
wgpu = { version = "30", default-features = false, features = ["metal", "wgsl"] }

[features]
node = ["dep:napi", "dep:napi-derive"]

[[test]]
# Runs on the main thread (the CoreText registry uses AppKit's font manager).
name = "fonts"
harness = false

[build-dependencies]
napi-build = "2.6"
