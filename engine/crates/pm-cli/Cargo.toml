[package]
name = "pm-cli"
description = "Headless binary, parity runner, test sinks (section 22)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "pm-cli"
path = "src/main.rs"
# The parity runner measures text with the native font registry, which uses
# AppKit's font manager and must stay on the main thread.
test = true

[dependencies]
pm-export = { path = "../pm-export" }
pm-blender = { path = "../pm-blender" }
pm-render = { path = "../pm-render" }
pm-model = { path = "../pm-model" }
pm-eval = { path = "../pm-eval" }
pm-text = { path = "../pm-text", features = ["system"] }
# The renderer's mirror, run natively for the native/wasm32 identity check
# and as the production expression engine.
pm-wasm = { path = "../pm-wasm" }
pm-protocol = { path = "../pm-protocol", default-features = false }
pm-time = { path = "../pm-time" }
# Direct, for its FFmpeg location (DEP_PM_MEDIA_NATIVE_FFMPEG_LIB in build.rs).
pm-media = { path = "../pm-media" }
serde.workspace = true
serde_json.workspace = true
sha2 = { workspace = true, features = ["std"] }
png = "0.18"
libc = "0.2"

[dev-dependencies]
serde_json.workspace = true
