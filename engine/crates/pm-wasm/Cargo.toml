[package]
name = "pm-wasm"
description = "The renderer's document mirror and synchronous evaluator, built for wasm32 (sections 6 and 7)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# cdylib: the module the renderer and the headless document host load;
# rlib: native tests and the native side of the bit-identity check.
crate-type = ["cdylib", "rlib"]

[dependencies]
pm-model = { path = "../pm-model" }
pm-time = { path = "../pm-time" }
pm-eval = { path = "../pm-eval" }
pm-expr = { path = "../pm-expr" }
# Level 1 text layout over registry answers and subsets from main (no
# platform registry in WebAssembly).
pm-text = { path = "../pm-text", default-features = false }
serde_json.workspace = true
ryu-js.workspace = true

# In the renderer `Math.pow` and `**` come from the page's own V8, so
# expression results equal the legacy evaluator's (docs/engine/expressions.md).
[target.'cfg(target_family = "wasm")'.dependencies]
pm-expr = { path = "../pm-expr", features = ["js-pow"] }

[dev-dependencies]
flate2 = "1.1"
