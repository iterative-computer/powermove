[package]
name = "pm-studio-host"
description = "Isolated native Studio renderer for the Electron viewer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
pm-studio = { path = "../../crates/pm-studio" }
serde.workspace = true
serde_json.workspace = true
glam = "0.30"
bytemuck = { version = "1", features = ["derive"] }
ufbx = "=0.11.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["metalfx"]
oidn = ["pm-studio/oidn"]
metalfx = ["pm-studio/metalfx"]
