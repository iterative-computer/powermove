[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "MPL-2.0", "CC0-1.0", "BSL-1.0",
  "AGPL-3.0-or-later", "0BSD",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
deny = [{ name = "rustybuzz" }, { name = "ttf-parser" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
