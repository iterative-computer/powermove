# Spike S7 (3D). Its own workspace so spike dependencies never touch engine/Cargo.lock.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = { version = "30.0.1", features = ["naga-ir"] }
naga = { version = "30.0.1", features = ["spv-in", "wgsl-in", "wgsl-out", "msl-out"] }
glslang = "0.8.1"
glslang-sys = "0.8.1"
spirv-tools = "0.13.3"
rspirv = "0.13.0"
pollster = "1"
png = "0.18"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.30"

[profile.release]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
