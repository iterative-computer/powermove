[package]
name = "s7-geom3d"
description = "pm-geom3d prototype: glTF decode, animation, skinning, BVH refit, picks; native and wasm32 (spike S7)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
gltf = { version = "1.4.1", default-features = false, features = ["utils", "names", "extensions", "extras", "KHR_materials_transmission", "KHR_materials_ior", "KHR_materials_volume", "KHR_materials_specular", "KHR_materials_emissive_strength", "KHR_materials_unlit", "KHR_texture_transform", "KHR_lights_punctual"] }
serde_json.workspace = true
image-webp = "0.2.4"
avif-parse = "2.1.0"
libm = "0.2"
glam = { workspace = true }
png = { workspace = true }
zune-jpeg = "0.4.13"

# rav1d (and re_rav1d) do not compile for wasm32-unknown-unknown (libc has no ptrdiff_t
# there); in the editor's wasm build, AVIF texels come from the browser's decoder, and
# geometry queries never need texels.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rav1d = { version = "1.1.0", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }

anyhow.workspace = true
