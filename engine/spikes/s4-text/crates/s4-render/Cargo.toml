[package]
name = "s4-render"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
s4-layout = { path = "../s4-layout" }
s4-registry = { path = "../s4-registry" }
serde.workspace = true
serde_json.workspace = true
read-fonts.workspace = true
skrifa.workspace = true
vello = "0.11"
vello_gpu = "0.3"
vello_cpu = { version = "0.3", features = ["multithreading", "text"] }
pollster = "0.4"
glifo = "0.4"
wgpu = "30.0.1"
png = "0.18"
kurbo = "0.13.1"
peniko = "0.6.1"

[target.'cfg(target_os = "macos")'.dependencies]
skia-safe = { version = "0.153.3", features = ["metal", "graphite"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSValue", "NSDictionary"] }
objc2-core-foundation = "0.3"
objc2-core-text = "0.3"
objc2-core-graphics = "0.3"
objc2-metal = "0.3"
