[workspace]

[package]
name = "s8-contention"
description = "Spike S8: cross-process GPU contention and GPU time slicing (plan section 8, contract 13)"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
wgpu = "30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
core-foundation = "0.10"
objc2 = "0.6"
objc2-metal = "0.3"

[profile.release]
debug = "line-tables-only"
