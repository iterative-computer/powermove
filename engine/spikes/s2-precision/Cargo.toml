[workspace]
resolver = "3"
members = ["."]

[package]
name = "s2-precision"
description = "Phase 0 spike S2: precision and encode (docs/rust-engine.md section 26)"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
objc2 = "0.6.5"
block2 = "0.6.2"
objc2-foundation = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-video = { version = "0.3.2", features = ["objc2-io-surface"] }
objc2-core-media = "0.3.2"
objc2-video-toolbox = { version = "0.3.2", features = ["objc2-core-media", "objc2-core-video", "objc2-foundation"] }
objc2-av-foundation = { version = "0.3.2", features = ["objc2-core-media", "objc2-core-video", "objc2-core-foundation", "objc2-core-graphics"] }
objc2-metal = "0.3.2"
objc2-io-surface = "0.3.2"
objc2-core-graphics = "0.3.2"
wgpu = "30.0.1"
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = "line-tables-only"
