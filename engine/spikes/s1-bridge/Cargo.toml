# Spike S1 (frame bridge). Its own workspace so it never touches engine/Cargo.toml.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[workspace.dependencies]
napi = { version = "3.14", default-features = false, features = ["napi9"] }
napi-derive = "3.6"
napi-build = "2.6"
wgpu = { version = "30.0.1", default-features = false, features = ["metal", "wgsl"] }
wgpu-hal = { version = "30.0.1", features = ["metal"] }
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-metal = "0.3.2"
objc2-io-surface = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
libc = "0.2"
thiserror = "2"

[profile.release]
debug = "line-tables-only"
