[package]
name = "s1-engine"
description = "Spike S1: engine addon hosted in an Electron utilityProcess (wgpu frames into IOSurface pools)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
s1-mach = { path = "../s1-mach" }
napi = { workspace = true, optional = true }
napi-derive = { workspace = true, optional = true }
wgpu = { workspace = true }
wgpu-hal = { workspace = true }
objc2 = { workspace = true }
objc2-foundation = { workspace = true }
objc2-metal = { workspace = true, features = ["objc2-io-surface"] }
objc2-io-surface = { workspace = true }
objc2-core-foundation = { workspace = true }
libc = { workspace = true }
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
node = ["dep:napi", "dep:napi-derive"]

[build-dependencies]
napi-build = { workspace = true }
